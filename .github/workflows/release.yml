name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 バージョン: $VERSION"

      - name: Build release binary
        run: swift build -c release

      - name: Create .app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_NAME="MacStorageMonitor"
          BUILD_DIR=".build/arm64-apple-macosx/release"
          APP_BUNDLE="${APP_NAME}.app"
          CONTENTS_DIR="${APP_BUNDLE}/Contents"
          MACOS_DIR="${CONTENTS_DIR}/MacOS"
          RESOURCES_DIR="${CONTENTS_DIR}/Resources"

          rm -rf "${APP_BUNDLE}"
          mkdir -p "${MACOS_DIR}"
          mkdir -p "${RESOURCES_DIR}"

          # バイナリをコピー
          cp "${BUILD_DIR}/${APP_NAME}" "${MACOS_DIR}/${APP_NAME}"

          # リソースバンドルをコピー（ローカライズファイル含む）
          RESOURCE_BUNDLE="${BUILD_DIR}/${APP_NAME}_${APP_NAME}.bundle"
          if [ -d "${RESOURCE_BUNDLE}" ]; then
            cp -R "${RESOURCE_BUNDLE}" "${RESOURCES_DIR}/"
            echo "✅ リソースバンドルをコピー: ${RESOURCE_BUNDLE}"
          else
            echo "⚠️ リソースバンドルが見つかりません: ${RESOURCE_BUNDLE}"
            # フォールバック: .build/release から探す
            FALLBACK_BUNDLE=".build/release/${APP_NAME}_${APP_NAME}.bundle"
            if [ -d "${FALLBACK_BUNDLE}" ]; then
              cp -R "${FALLBACK_BUNDLE}" "${RESOURCES_DIR}/"
              echo "✅ フォールバックリソースバンドルをコピー"
            fi
          fi

          # Info.plist 生成
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string ja" "${CONTENTS_DIR}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string MacStorageMonitor" "${CONTENTS_DIR}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.local.MacStorageMonitor" "${CONTENTS_DIR}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleInfoDictionaryVersion string 6.0" "${CONTENTS_DIR}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string Mac Storage Monitor" "${CONTENTS_DIR}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "${CONTENTS_DIR}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${VERSION}" "${CONTENTS_DIR}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${VERSION}" "${CONTENTS_DIR}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 14.0" "${CONTENTS_DIR}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" "${CONTENTS_DIR}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "${CONTENTS_DIR}/Info.plist"

          echo "✅ .app バンドル作成完了"
          echo "📂 バンドル内容:"
          find "${APP_BUNDLE}" -type f

      - name: Sign .app bundle (ad-hoc)
        run: |
          codesign --force --deep --sign - MacStorageMonitor.app
          echo "✅ アドホック署名完了"
          codesign --verify --verbose MacStorageMonitor.app

      - name: Create ZIP archive
        run: |
          ditto -c -k --keepParent MacStorageMonitor.app MacStorageMonitor.app.zip
          echo "✅ ZIP作成完了: $(du -h MacStorageMonitor.app.zip | cut -f1)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Mac Storage Monitor ${{ github.ref_name }}"
          body: |
            ## Mac Storage Monitor ${{ github.ref_name }}

            ### インストール方法
            1. `MacStorageMonitor.app.zip` をダウンロード
            2. ZIPを展開
            3. `MacStorageMonitor.app` を `/Applications/` に移動
            4. 初回起動時に「開発元を確認できない」と表示された場合:
               - システム設定 > プライバシーとセキュリティ > 「このまま開く」をクリック
            5. アプリを起動

            ### 動作環境
            - macOS 14 (Sonoma) 以降
            - Apple Silicon (arm64)
          files: MacStorageMonitor.app.zip
          generate_release_notes: true
